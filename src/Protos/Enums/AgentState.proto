syntax = "proto3";

package gaapicommon.enums;
option csharp_namespace = "GAAPICommon.Enums";

enum AgentState {
    Waiting = 0;
    Ready = 1;
    Moving = 2;
    Sleeping = 3;
    Servicing = 4;
    Error = 5;
    Fatal = 6;
    Stationary = 7;
    Executing = 8;
    Aborting = 9;
    NotInMap = 10;
    Estopped = 11;
    Safety = 12;
    Offline = 13;
    Charging = 14;
    AttachmentError = 15;
    ManualMode = 16;
}