syntax = "proto3";

package gaapicommon.messages;
option csharp_namespace = "GAAPICommon.Messages";

// Identifies the kind of roadmap item holding a commitment.
enum RoadmapMapItemType {
  UnknownRoadmapMapItemType = 0;
  Node = 1;
  Move = 2;
}

// Identifies whether a commitment belongs to an AGV or a scheduler-owned marker.
enum RoadmapOccupierType {
  UnknownRoadmapOccupierType = 0;
  Agent = 1;
  Special = 2;
}

// A live commitment between an occupier and a roadmap node or move.
message RoadmapOccupierDto {
  // The scheduler roadmap item identifier.
  int32 MapItemId = 1;
  // The kind of roadmap item.
  RoadmapMapItemType MapItemType = 2;
  // The agent or special occupier identifier.
  int32 OccupierId = 3;
  // The kind of occupier.
  RoadmapOccupierType OccupierType = 4;
  // Display name for the node or move.
  string MapItemDisplayName = 5;
  // Display name for the agent or special occupier.
  string DisplayName = 6;
}
